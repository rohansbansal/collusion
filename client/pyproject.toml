[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "exchange-client"
version = "0.1.0"
description = "Typed async trading client for the agent exchange"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.0,<3", "websockets>=14,<18"]

[tool.hatch.build.targets.wheel]
packages = ["src/exchange_client"]
