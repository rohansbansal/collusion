[project]
name = "exchange"
version = "0.1.0"
description = "A simulated exchange with agent order entry and streaming market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
